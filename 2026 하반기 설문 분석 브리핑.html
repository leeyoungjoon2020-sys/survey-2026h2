<title>2026 하반기 설문 분석 브리핑</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
/* Layout: Tourlinks 종합업무회의 form — gradient header band with "title ." + red dot and logo, grey canvas, white summary box with orange heading, grey rounded cards with blue pills */
:root{
  --band-a:#4d4376; --band-b:#2e5576;
  --canvas:#e7eaee; --paper:#ffffff; --card:#eeeff1; --card-line:#c8ccd2; --box-line:#bfbfbf;
  --ink:#1e232e; --ink-2:#4a5260; --muted:#6b7380;
  --orange:#d94a22; --dot:#e71324; --blue:#0e6fed; --pill:#d8e7fc; --pill-line:#c1dafb;
  --bar-muted:#c4ccd8; --bar-2:#e8a34a; --neg:#d6332a; --neg-soft:#fde5e2; --pos:#17865a; --pos-soft:#e0f3ea;
  --font:'인터파크고딕 M','InterparkGothicM','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --canvas:#141922; --paper:#1c2330; --card:#222a38; --card-line:#323d50; --box-line:#3a4559;
  --ink:#e9edf3; --ink-2:#b6bfcc; --muted:#8792a3;
  --orange:#ff7a4d; --dot:#ff4d5a; --blue:#6aa8ff; --pill:#1d3354; --pill-line:#2b4a78;
  --bar-muted:#3b4658; --bar-2:#e3a75a; --neg:#ff6b61; --neg-soft:#3a2023; --pos:#4fcf94; --pos-soft:#173328; color-scheme:dark}
  :root:not([data-theme="light"]) .rmx td.lo{background:#3a2a20;color:#ffa070}}
:root[data-theme="dark"] .rmx td.lo{background:#3a2a20;color:#ffa070}
:root[data-theme="dark"]{
  --canvas:#141922; --paper:#1c2330; --card:#222a38; --card-line:#323d50; --box-line:#3a4559;
  --ink:#e9edf3; --ink-2:#b6bfcc; --muted:#8792a3;
  --orange:#ff7a4d; --dot:#ff4d5a; --blue:#6aa8ff; --pill:#1d3354; --pill-line:#2b4a78;
  --bar-muted:#3b4658; --bar-2:#e3a75a; --neg:#ff6b61; --neg-soft:#3a2023; --pos:#4fcf94; --pos-soft:#173328; color-scheme:dark}
html[lang="zh"]{--font:'인터파크고딕 M','Noto Sans SC','PingFang SC','Microsoft YaHei','Noto Sans KR',system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{font-family:var(--font);background:var(--canvas);color:var(--ink);font-size:15px;line-height:1.6;overflow-x:hidden;word-break:keep-all}
html[lang="en"] body,html[lang="zh"] body{word-break:normal;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--band-a)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance} p{margin:0}

/* header band */
.hdr{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:50}
.band{position:relative;height:64px;display:flex;align-items:center;gap:14px;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  background:linear-gradient(100deg,var(--band-a),var(--band-b));color:#fff;box-shadow:0 2px 10px rgba(20,25,50,.25)}
.band .ttl{font-size:clamp(17px,2vw,24px);font-weight:900;letter-spacing:-.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.band .ttl .dot{color:#ff3344;margin-left:4px}
.band .ttl .sep{opacity:.8;margin:0 6px}
.band .tools{display:flex;align-items:center;gap:8px;flex-shrink:0}
.band .logo{height:18px;width:auto;display:block;margin-left:6px}
.lang{display:flex;gap:2px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:rgba(255,255,255,.85);font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.lang button[aria-pressed="true"]{background:#fff;color:#2e3f6b}
.pbtn{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:700;white-space:nowrap}
.search{position:relative}
.search input{width:220px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:6px 12px 6px 32px;font:inherit;font-size:13px}
.search input::placeholder{color:rgba(255,255,255,.7)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:rgba(255,255,255,.8);pointer-events:none}
.results{position:absolute;right:0;top:calc(100% + 8px);width:min(380px,calc(100vw - 32px));max-height:min(420px,70vh);overflow:auto;background:var(--paper);border:1px solid var(--card-line);border-radius:10px;box-shadow:0 14px 40px rgba(20,25,50,.25);padding:6px;color:var(--ink)}
.results button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:9px 10px}
.results button:hover,.results button.sel{background:var(--pill)}
.results .rt{font-size:14px;font-weight:700;display:flex;gap:8px;align-items:baseline}
.results .rt .pg{font-size:11px;color:var(--orange);font-weight:900}
.results .rs{font-size:12px;color:var(--muted);margin-top:2px}
.results mark{background:transparent;color:var(--blue);font-weight:700}
.results .none{padding:12px;font-size:13px;color:var(--muted)}
.progress{position:absolute;bottom:-3px;left:0;height:3px;background:var(--dot);width:0;transition:width .2s}
.regbar{display:flex;align-items:center;gap:6px;overflow-x:auto;background:var(--paper);border-bottom:1px solid var(--card-line);padding-block:7px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));scrollbar-width:none}
.regbar .lbl{font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap;margin-right:4px}
.regbar button{border:1px solid var(--card-line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap;display:flex;gap:5px;align-items:baseline}
.regbar button small{font-size:11px;color:var(--muted);font-weight:500}
.regbar button[aria-selected="true"]{background:#2e3f6b;border-color:#2e3f6b;color:#fff}
.regbar button[aria-selected="true"] small{color:rgba(255,255,255,.75)}
.regbar .hint{font-size:12px;color:var(--muted);white-space:nowrap;margin-left:6px}
.rview{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:10px;font-size:13px;background:var(--pill);border:1px solid var(--pill-line);color:var(--ink);border-radius:8px;padding:7px 12px}
.rview b{color:var(--blue)}
.rview.all{background:var(--canvas);border-color:var(--card-line);color:var(--ink-2)}
.hero .mgr{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.2)}
.hero .mgr .mv{font-size:28px;font-weight:900;letter-spacing:-.02em}
.hero .mgr .mv small{font-size:13px;font-weight:700;margin-left:4px;color:rgba(255,255,255,.85)}
.yr.m .b i{background:#e8a34a}

/* nav */
.dots{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 10px));top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;gap:11px}
.dots a{display:block;width:9px;height:9px;border-radius:50%;background:var(--bar-muted);position:relative;transition:transform .2s,background .2s}
.dots a.active{background:var(--orange);transform:scale(1.4)}
.dots a span{position:absolute;right:18px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:12px;background:var(--band-b);color:#fff;padding:4px 10px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .15s}
.dots a:hover span,.dots a:focus-visible span{opacity:1}
.pager{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 10px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--card-line);border-radius:999px;padding:4px 6px 4px 14px;box-shadow:0 6px 18px rgba(20,25,50,.12)}
.pager .count{font-size:12px;color:var(--muted);font-weight:700;min-width:38px}
.pager button{width:30px;height:30px;border-radius:50%;border:0;background:var(--canvas);display:grid;place-items:center}
.pager svg{width:16px;height:16px}

/* slides */
.slide{min-height:100vh;padding-block:132px 64px;padding-left:max(56px,env(safe-area-inset-left,0px));padding-right:max(56px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;justify-content:center;position:relative}
.wrap{max-width:1200px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sbox{background:var(--paper);border:1px solid var(--box-line);padding:16px 22px 18px}
.sbox h2{font-size:clamp(19px,2.1vw,25px);font-weight:700;color:var(--orange);line-height:1.4;letter-spacing:-.02em}
.sbox ul{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:3px}
.sbox li{font-size:15px;color:var(--ink);line-height:1.6}
.sbox li::before{content:"· ";color:var(--muted)}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--paper);border:1px solid var(--card-line);border-radius:var(--radius);padding:14px 16px}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .v{font-size:clamp(26px,2.7vw,34px);font-weight:900;color:var(--blue);letter-spacing:-.02em;line-height:1.2;margin:4px 0 2px}
.kpi.warn .v{color:var(--orange)}
.kpi .v small{font-size:.5em;font-weight:700;margin-left:2px;color:var(--ink-2)}
.kpi .d{font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.cards{grid-template-columns:repeat(2,minmax(0,1fr))}
.cards.wide{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.card{background:var(--card);border:1px solid var(--card-line);border-radius:var(--radius);padding:14px 16px 16px;min-width:0}
.card h3{font-size:16px;font-weight:700;margin-bottom:6px}
.card.full{grid-column:1/-1}
.pill{display:inline-block;background:var(--pill);border:1px solid var(--pill-line);color:var(--blue);font-size:12px;font-weight:500;border-radius:999px;padding:1px 12px;margin-bottom:10px}
.note{font-size:13px;color:var(--ink-2);background:var(--paper);border:1px solid var(--card-line);border-radius:8px;padding:10px 12px;margin-top:12px}
.wow{display:inline-flex;font-size:11.5px;font-weight:700;padding:0 8px;border-radius:999px;white-space:nowrap}
.wow.up{background:var(--pos-soft);color:var(--pos)} .wow.dn{background:var(--neg-soft);color:var(--neg)} .wow.fl{background:var(--canvas);color:var(--muted)}

/* bars */
.cbar,.cmp{display:grid;grid-template-columns:minmax(0,180px) 1fr auto;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.cbar .b{height:11px;background:var(--paper);border-radius:6px;overflow:hidden;border:1px solid var(--card-line)}
.cbar .b i{display:block;height:100%;background:var(--bar-muted)}
.cbar.hl .b i{background:var(--blue)} .cbar.hot .b i{background:var(--orange)}
.cbar .n,.cmp .n{text-align:right;color:var(--ink-2);white-space:nowrap}
.cmp .bars{display:flex;flex-direction:column;gap:3px}
.cmp .bars i{display:block;height:7px;border-radius:4px;min-width:2px}
.cmp .bars i.a{background:var(--bar-muted)} .cmp .bars i.b{background:var(--blue)} .cmp .bars i.m{background:var(--bar-2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2);margin:-4px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.cols{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px;align-items:end;height:180px}
.cols div{display:flex;flex-direction:column;align-items:center;justify-content:end;gap:3px;height:100%;font-size:11px;color:var(--ink-2)}
.cols i{display:block;width:72%;border-radius:3px 3px 0 0;background:var(--bar-muted)}
.cols i.hl{background:var(--blue)} .cols i.alt{background:var(--orange)}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.mini div{background:var(--paper);border:1px solid var(--card-line);border-radius:8px;padding:10px 12px}
.mini b{display:block;font-size:20px;font-weight:900;color:var(--blue)}
.mini span{font-size:12px;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--paper)}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--card-line);white-space:nowrap}
th{background:#2e3f6b;color:#fff;font-weight:700;font-size:12.5px}
th:first-child,td:first-child{text-align:left}
tr.hl td{background:var(--pill)}
td.muted{color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.list li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:14px}
.list .pill{margin:0}
.takes{grid-template-columns:repeat(2,minmax(0,1fr))}
.take h3{font-size:16px} .take p{font-size:14px;color:var(--ink-2)}
.take a{font-size:13px;color:var(--blue);font-weight:700;text-decoration:none;display:inline-block;margin-top:6px}
.acts{grid-template-columns:repeat(3,minmax(0,1fr))}
.act .hd{display:flex;justify-content:space-between;gap:8px;align-items:start}
.act .tag{font-size:11px;font-weight:700;border-radius:999px;padding:1px 9px;white-space:nowrap;background:var(--paper);border:1px solid var(--card-line);color:var(--ink-2)}
.act .tag.neg{background:var(--neg-soft);border-color:transparent;color:var(--neg)}
.act p{font-size:13.5px;color:var(--ink-2)}
.act .who{font-size:12px;color:var(--muted);margin-top:8px;padding-top:6px;border-top:1px dashed var(--card-line)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--font);fill:var(--ink-2);font-size:12px}
.chart .t-strong{fill:var(--ink);font-weight:700}
.chart .t-muted{fill:var(--muted)}
.chart .grid-l{stroke:var(--card-line);stroke-width:1}
.foot{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:12px;color:var(--muted);margin-top:4px}
.foot .tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.foot .tags button{border:1px dashed var(--card-line);background:transparent;border-radius:999px;padding:0 9px;font-size:11.5px;color:var(--muted)}
.foot .tags button:hover{color:var(--blue);border-color:var(--blue)}
.foot .pg{font-weight:700}
.slide.hit .sbox{animation:hit 1.4s ease}
@keyframes hit{20%{box-shadow:0 0 0 5px rgba(231,19,36,.25)}100%{box-shadow:0 0 0 0 rgba(231,19,36,0)}}
.src{font-size:12px;color:var(--muted)}

/* hover detail */
.tip{position:fixed;z-index:80;max-width:300px;background:#1f2a48;color:#fff;font-size:12.5px;line-height:1.55;border-radius:8px;padding:8px 11px;box-shadow:0 10px 28px rgba(10,15,35,.3);pointer-events:none;white-space:pre-line}
.tip b{color:#ffd28a}
[data-tip]{cursor:help}
.cbar:hover .b i,.cbar:focus .b i{filter:brightness(1.12)}
.cbar:hover,.cmp:hover,.cbar:focus,.cmp:focus{background:rgba(14,111,237,.06);border-radius:6px;outline:none}
.cols div:hover i,.cols div:focus i{filter:brightness(1.15)}
.kpi:hover,.kpi:focus{border-color:var(--blue);outline:none}
td[data-tip]:hover{outline:1px solid var(--blue);outline-offset:-1px}
/* region comparison */
.rtabs{display:flex;flex-wrap:wrap;gap:6px}
.rtabs button{border:1px solid var(--card-line);background:var(--paper);border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:700;color:var(--ink-2);display:flex;gap:6px;align-items:baseline}
.rtabs button small{font-size:11px;color:var(--muted);font-weight:500}
.rtabs button[aria-selected="true"]{background:#2e3f6b;border-color:#2e3f6b;color:#fff}
.rtabs button[aria-selected="true"] small{color:rgba(255,255,255,.75)}
.rmx th,.rmx td{text-align:right;padding:6px 9px}
.rmx th:first-child,.rmx td:first-child{text-align:left}
.rmx td.hi{background:var(--pill);color:var(--blue);font-weight:700}
.rmx td.lo{background:#fdebe1;color:#b8461d;font-weight:700}
.rmx th.cur{background:#d94a22}
.rmx td.cur{box-shadow:inset 2px 0 0 #d94a22,inset -2px 0 0 #d94a22}
.region-stack{display:flex;flex-direction:column;gap:14px}
/* cover / end like the template's title slide */
.cover,.end{background:linear-gradient(160deg,var(--band-a) 0%,#3f4a76 45%,var(--band-b) 100%);color:#fff}
.cover .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:center}
.cover .eyebrow{font-size:13px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.75)}
.cover h1{font-size:clamp(34px,4.8vw,60px);font-weight:900;letter-spacing:-.04em;line-height:1.15;margin:14px 0}
.cover h1 .dot,.end h2 .dot{color:#ff3344}
.cover .sub{font-size:17px;color:rgba(255,255,255,.85)}
.cover .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.cover .meta span{font-size:12.5px;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:4px 12px}
.cover .date{position:absolute;right:max(56px,env(safe-area-inset-right,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px));font-size:18px;font-weight:700}
.hero{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);border-radius:14px;padding:22px}
.hero .l{font-size:13px;color:rgba(255,255,255,.75)}
.hero .v{font-size:clamp(40px,4.6vw,58px);font-weight:900;letter-spacing:-.03em;line-height:1.1;margin:4px 0 6px}
.hero .v small{font-size:.38em;font-weight:700;margin-left:6px;color:rgba(255,255,255,.85)}
.yr{display:grid;grid-template-columns:minmax(52px,auto) 1fr 40px;gap:10px;align-items:center;font-size:13px;margin-top:9px;color:rgba(255,255,255,.85)}
.yr .b{height:9px;border-radius:5px;background:rgba(255,255,255,.18);overflow:hidden}
.yr .b i{display:block;height:100%;background:rgba(255,255,255,.5)}
.yr.now .b i{background:#ff6b5e} .yr.now{font-weight:700;color:#fff}
.yr .n{text-align:right}
.end .wrap{align-items:flex-start;gap:14px}
.end h2{font-size:clamp(36px,4.5vw,56px);font-weight:900}
.end p{color:rgba(255,255,255,.85);max-width:60ch}
.end img{height:26px;width:auto}
body.present .slide{padding-block:120px 48px}
body.present .dots,body.present .pager{opacity:.35}

@media (max-width:1100px){.search input{width:150px}.band .logo{display:none}}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.cards,.cards.wide,.takes,.acts{grid-template-columns:minmax(0,1fr)}.cover .wrap{grid-template-columns:minmax(0,1fr);gap:28px}}
@media (max-width:720px){
  .regbar .hint{display:none}
  .band{height:auto;min-height:64px;flex-wrap:wrap;padding-block:8px;gap:8px}
  .band .ttl{flex-basis:100%}
  .band .tools{flex-wrap:wrap}
  .search input{width:140px}
  .pbtn,.dots{display:none}
  .slide{min-height:auto;padding-block:176px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .cover{min-height:100vh}
  .kpis,.mini{grid-template-columns:minmax(0,1fr)}
  .cbar,.cmp{grid-template-columns:minmax(0,104px) 1fr auto}
  .cover .date{position:static;margin-top:18px}
}
</style>

<header class="hdr" id="hdr"><div class="band" id="band">
  <div class="ttl" id="hdrTitle"></div>
  <div class="tools">
    <div class="search" role="search">
